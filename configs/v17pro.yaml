# Reuse v16pro's comparison protocol and recovery configuration.
extends: v16pro.yaml
version: v17pro
data:
  dataset: mnist_audiomnist
  paper_split:
    mode: speaker
    val_speakers: ['07', '14', '22', '25', '34', '35', '41', '50', '54']
    test_speakers: ['13', '20', '24', '26', '31', '42', '49', '55', '59']
audio:
  audiomnist_root: _data/AudioMNIST
  feature_cache_dir: _data/audiomnist_mel
  auto_download: false
v17:
  arm: main
  private_index:
    enabled: true
    size: 128
    k_wta: 24
  mult:
    enabled: true
    width: 64
    heads: 4
