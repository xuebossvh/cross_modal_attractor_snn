# v12b ablation: remove only the causal Cross-Key training loss.
extends: v12b.yaml
cross_key_conditioning:
  causal_training:
    enabled: false
    loss_weight: 0.0
train:
  output_version: v12b_no_causal
  ckpt_path: outputs/checkpoints/cross_modal_snn_v12b_no_causal.pt
  eval_ckpt_path: outputs/checkpoints/cross_modal_snn_v12b_no_causal.pt
