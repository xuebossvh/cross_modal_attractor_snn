# v11e control: identical real pairs and Cross-Key path, but no Cross-Detail
# injection and no pair-alignment objective. Pair projectors remain constructed
# so checkpoint structure/parameter count stay matched with the main model.
extends: v11e.yaml

cross_detail_conditioning:
  enabled: false
  build_modules: true
  detach_source: false
  causal_training:
    enabled: false
    loss_weight: 0.0

pair_alignment:
  enabled: false
  build_modules: true
  loss_weight: 0.0

data:
  pairing:
    mode: "true_source_one_to_one_control"

train:
  output_version: v11e_control
  ckpt_path: "outputs/checkpoints/cross_modal_snn_v11e_control.pt"
  best_ckpt_path: "outputs/checkpoints/cross_modal_snn_v11e_control_best.pt"
  eval_ckpt_path: "outputs/checkpoints/cross_modal_snn_v11e_control_best.pt"

validation:
  score:
    lambda_pair: 0.0
