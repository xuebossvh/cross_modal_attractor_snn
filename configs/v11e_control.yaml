# v11e control: identical MNIST/FSDD category targets and training budget,
# with Cross-Key disabled. Modules remain built for matched checkpoint structure.
extends: v11e.yaml

cross_key_conditioning:
  enabled: false
  build_modules: true
  detach_key: true
  causal_training:
    enabled: false
    loss_weight: 0.0

train:
  output_version: v11e_control
  ckpt_path: "outputs/checkpoints/cross_modal_snn_v11e_control.pt"
  eval_ckpt_path: "outputs/checkpoints/cross_modal_snn_v11e_control.pt"
